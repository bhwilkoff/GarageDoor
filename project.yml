# XcodeGen spec for the iOS app (iPhone, iPad).
# The agent creates the project with `xcodegen generate` (brew install xcodegen);
# nobody clicks through Xcode's New Project sheet. AppName.xcodeproj is generated
# output and gitignored: change the project HERE, then regenerate. A hand-edit in
# Xcode is silently wiped on the next generate.
#
# To adopt: rename `AppName` (name, target, PRODUCT_NAME, scheme) and set
# bundleIdPrefix + PRODUCT_BUNDLE_IDENTIFIER. No spaces in the name.
name: AppName
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  # iOS 18 is the floor because lock-screen and Control Center controls
  # (WidgetKit ControlWidget) arrived in iOS 18; tools/test_ios_floor.py holds
  # it. macOS is here only for the Core unit-test bundle, which runs without a
  # simulator.
  deploymentTarget:
    iOS: "18.0"
    macOS: "26.0"
  groupSortPosition: top
# MARKETING_VERSION / CURRENT_PROJECT_VERSION come ONLY from this file
# (Decision 003). Never set them on the target; a target copy shadows it.
configFiles:
  Debug: AppVersion.xcconfig
  Release: AppVersion.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Approachable concurrency: code is MainActor-isolated by default, so
    # SwiftUI views and @Observable stores need no annotation. APIClient is an
    # actor and stays off the main actor on its own.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    # Left empty on purpose: never commit a team id to the template. Simulator
    # and CODE_SIGNING_ALLOWED=NO builds need none. For a device or archive
    # build, set your 10-char Team ID here in the adopting app, or pass
    # DEVELOPMENT_TEAM=XXXXXXXXXX to xcodebuild (tools/submit-appstore.sh
    # passes $ASC_TEAM_ID).
    DEVELOPMENT_TEAM: ""
targets:
  AppName:
    type: application
    # iPhone (and iPad) only. The widget/control extension joins as a second
    # target when the control is built.
    supportedDestinations: [iOS]
    sources:
      - path: apple
        excludes:
          - "Tests/**"
          # The folder READMEs are notes for people, not app resources.
          - "**/*.md"
    scheme:
      testTargets:
        - AppNameTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appname
        PRODUCT_NAME: AppName
        # Xcode writes the Info.plist from INFOPLIST_KEY_* settings, so there
        # is no plist file to drift. CFBundleVersion and the short version are
        # filled from AppVersion.xcconfig automatically.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AppName
        # Standard HTTPS only: skips the export-compliance question on every
        # TestFlight / App Store build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Core unit tests. NOT hosted in the app: hosting the universal app built the
  # app module twice ("Multiple commands produce AppName.swiftmodule") in
  # Tidbits Trivia. Compiling Core/ straight into the bundle avoids that.
  # macOS-only, so
  # `xcodebuild test -destination platform=macOS` needs no simulator.
  AppNameTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: apple/Tests
      - path: apple/Core
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appname.CoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
